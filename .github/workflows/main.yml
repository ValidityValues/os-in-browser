name: macOS Remote Desktop

run-name: macOS ARM Remote Desktop

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

on:
  workflow_dispatch:
    inputs:
      username:
        description: "Username for the remote desktop"
        type: string
        required: true
        default: "macuser"

      password:
        description: "Password for the remote desktop"
        type: string
        required: true

jobs:
  macos:
    name: macOS ARM64 Desktop
    runs-on: macos-26-xlarge

    environment:
      name: ${{ github.run_id }}

    permissions:
      contents: read
      deployments: write

    env:
      PORT: 8080
      GITHUB_TOKEN: ${{ github.token }}

    steps:
      - name: Show runner information
        run: |
          echo "=== SYSTEM ==="
          sw_vers

          echo
          echo "=== KERNEL ==="
          uname -a

          echo
          echo "=== CPU ==="
          sysctl -n machdep.cpu.brand_string || true
          sysctl -n hw.ncpu || true
          sysctl -n hw.memsize || true

          echo
          echo "=== ARCH ==="
          uname -m

          echo
          echo "=== MACOS ==="
          system_profiler SPHardwareDataType

      - name: Install cloudflared
        run: |
          curl -fsSL \
            "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-darwin-arm64.tgz" \
            -o cloudflared.tgz

          tar -xzf cloudflared.tgz

          chmod +x ./cloudflared

          ./cloudflared --version

      - name: Start Cloudflare Tunnel
        id: tunnel
        env:
          METRICS_URL: "127.0.0.1:8081"
        run: |
          ./cloudflared tunnel \
            --metrics="${METRICS_URL}" \
            --url "http://127.0.0.1:${PORT}" \
            > cloudflared.log 2>&1 &

          CLOUDFLARED_PID=$!
          echo "pid=${CLOUDFLARED_PID}" >> "$GITHUB_OUTPUT"

          echo "Waiting for Cloudflare Quick Tunnel..."

          for i in {1..120}; do
            if JSON="$(curl -fsS "http://${METRICS_URL}/quicktunnel" 2>/dev/null)"; then
              HOSTNAME="$(jq -r '.hostname // empty' <<< "${JSON}")"

              if [ -n "${HOSTNAME}" ]; then
                TUNNEL_URL="https://${HOSTNAME}"

                echo "url=${TUNNEL_URL}" >> "$GITHUB_OUTPUT"

                echo
                echo "========================================"
                echo "REMOTE DESKTOP URL:"
                echo "${TUNNEL_URL}"
                echo "========================================"
                echo

                break
              fi
            fi

            sleep 1
          done

          if ! grep -q '^url=' "$GITHUB_OUTPUT"; then
            echo "Cloudflare Quick Tunnel failed to start."
            echo
            cat cloudflared.log || true
            exit 1
          fi

      - name: Download macOS ARM64 os-in-browser
        env:
          RELEASE_REPO: kingdudely/os-in-browser
        run: |
          echo "Getting latest release..."

          TAG="$(
            gh release view \
              --repo "${GITHUB_REPOSITORY}" \
              --json tagName \
              --jq '.tagName' 2>/dev/null \
            || gh release view \
              --repo "${RELEASE_REPO}" \
              --json tagName \
              --jq '.tagName'
          )"

          if [ -z "${TAG}" ]; then
            echo "Unable to determine latest release tag."
            exit 1
          fi

          echo "Release: ${TAG}"

          VERSION="${TAG#v}"

          ZIP_NAME="os-in-browser-darwin-arm64-${VERSION}.zip"

          echo "Downloading ${ZIP_NAME}..."

          gh release download "${TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "${ZIP_NAME}" \
          || gh release download "${TAG}" \
            --repo "${RELEASE_REPO}" \
            --pattern "${ZIP_NAME}"

          unzip -q "${ZIP_NAME}" || {
            STATUS=$?

            if [ "${STATUS}" -ne 1 ]; then
              exit "${STATUS}"
            fi
          }

          echo
          echo "Downloaded files:"
          find . -maxdepth 3 -type f | sort

      - name: Prepare credentials
        run: |
          USERNAME="$(jq -r '.inputs.username // empty' "$GITHUB_EVENT_PATH")"
          PASSWORD="$(jq -r '.inputs.password // empty' "$GITHUB_EVENT_PATH")"

          if [ -z "${USERNAME}" ]; then
            echo "Username is empty."
            exit 1
          fi

          if [ -z "${PASSWORD}" ]; then
            echo "Password is empty."
            exit 1
          fi

          echo "::add-mask::${USERNAME}"
          echo "::add-mask::${PASSWORD}"

          echo "USERNAME=${USERNAME}" >> "$GITHUB_ENV"
          echo "PASSWORD=${PASSWORD}" >> "$GITHUB_ENV"

      - name: Launch macOS remote desktop
        env:
          TUNNEL_URL: ${{ steps.tunnel.outputs.url }}
        run: |
          echo
          echo "========================================"
          echo "macOS ARM64 remote desktop"
          echo "========================================"
          echo "Runner:"
          sw_vers
          echo
          echo "Architecture:"
          uname -m
          echo
          echo "Remote URL:"
          echo "${TUNNEL_URL}"
          echo "========================================"
          echo

          APP_BINARY="./os-in-browser.app/Contents/MacOS/os-in-browser"

          if [ ! -f "${APP_BINARY}" ]; then
            echo "Application binary not found:"
            echo "${APP_BINARY}"
            echo
            find . -name "os-in-browser" -o -name "os-in-browser.app"
            exit 1
          fi

          chmod +x "${APP_BINARY}"

          "${APP_BINARY}" \
            --disable-features=MacCatapLoopbackAudioForScreenShare
